# Docker Compose for Google Cloud e2-micro VM
# Optimized for 1GB RAM total (TimescaleDB + 2 services + overhead)
# Memory budget: TimescaleDB 350M + Data Collector 150M + Dashboard 180M = 680M
# NOTE: Optimizer runs on Render (polymarket-optimizer-server.onrender.com)
#
# Usage:
#   docker compose -f docker-compose.gcp.yml up -d

services:
  # ============================================
  # TimescaleDB (PostgreSQL with time-series)
  # ============================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: polymarket-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: polymarket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-polymarket_prod}
      POSTGRES_DB: polymarket_trading
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./packages/data-collector/src/database/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    # Tune PostgreSQL for low memory (1GB VM shared with other services)
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "wal_buffers=4MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymarket -d polymarket_trading"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 220M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Data Collector (Node.js)
  # ============================================
  data-collector:
    image: ghcr.io/javimaligno/polymarket-trader/data-collector:latest
    container_name: polymarket-data-collector
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: ${DATABASE_URL}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      GAMMA_API_URL: https://gamma-api.polymarket.com
      CLOB_API_URL: https://clob.polymarket.com
      DATA_API_URL: https://data-api.polymarket.com
      MAX_TRACKED_MARKETS: "35"
      ALLOWED_MARKET_TYPES: "crypto_intraday,crypto_daily,event_financial,event_short"
      MAX_SHADOW_MARKETS: "10"
      DB_POOL_MAX: "8"
      DB_IDLE_TIMEOUT_MS: "10000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_DAILY_BUDGET_USD: "1.0"
      NEWS_MIN_ENTITY_LENGTH: "4"
      NEWS_MIN_SENTIMENT: "0.05"
      PORT: 10000
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:10000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 80M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Dashboard API (Node.js - Signals + Trading)
  # ============================================
  dashboard-api:
    image: ghcr.io/javimaligno/polymarket-trader/dashboard-api:latest
    container_name: polymarket-dashboard-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: "*"
      API_KEY: ${API_KEY:-}
      DATABASE_URL: ${DATABASE_URL}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      DB_POOL_MAX: "10"
      DB_IDLE_TIMEOUT_MS: "10000"
      ENABLE_SIGNAL_ENGINE: "true"
      SIGNAL_INTERVAL_MS: "300000"
      MAX_SIGNAL_MARKETS: "35"
      ENABLE_OPTIMIZATION: "true"
      OPTIMIZER_URL: "https://polymarket-optimizer-server.onrender.com"
      # Min Sharpe lift required to flip direction_multiplier per market_type.
      # Default 0 (disabled) lets the optimizer flip on any improvement, which
      # produced the event_long → +1 drift on 2026-05-01. 0.5 means a flip is
      # only persisted when it improves Sharpe by at least 0.5 vs the previous
      # best for that market_type — kills marginal flips, lets real ones through.
      OPTIMIZER_DM_FLIP_MIN_LIFT: "0.5"
      POLYMARKET_API_URL: https://clob.polymarket.com
      INITIAL_CAPITAL: "10000"
      FEE_RATE: "0.001"
      MAX_DRAWDOWN: "0.15"
      MAX_DAILY_LOSS: "500"
      # Risk Protection System
      ENABLE_RISK_PROTECTION: "true"
      MAX_EXPOSURE_PER_MARKET: "0.05"
      MAX_TOTAL_EXPOSURE: "0.80"
      TRAILING_STOP_PCT: "0.15"
      HARD_STOP_PCT: "0.25"
      # Stop Loss Service
      STOP_LOSS_PCT: "20"
      TAKE_PROFIT_PCT: "40"
      USE_TIME_EXIT: "true"
      MAX_HOLD_TIME_HOURS: "4"
      # Executor limits - generous for paper trading (detect problems, not hide them)
      EXECUTOR_MAX_POSITION_SIZE: "500"
      EXECUTOR_MAX_OPEN_POSITIONS: "500"
      EXECUTOR_MAX_DAILY_TRADES: "10000"
      EXECUTOR_MARKET_COOLDOWN_MS: "1800000"
      EXECUTOR_NEAR_RESOLVED_UPPER: "0.97"
      EXECUTOR_NEAR_RESOLVED_LOWER: "0.03"
      # SHORT asymmetric guards (PRs #110/#111) relaxed 2026-05-04: the 0%
      # SHORT WR they were defending against was the dm=-1 double-inversion
      # (PR #178), not a real SHORT pathology. Counter-WR on the same cohort
      # was 93.9%. Both set to 1.0 (no-op) to let the post-flip SHORT cohort
      # materialize. Re-tighten only if post-flip live SHORT WR underperforms.
      EXECUTOR_SHORT_MAX_YES_PRICE: "1.0"
      EXECUTOR_SHORT_SIZE_MULT: "1.0"
      # Loss-gate regime epoch: per-market consecutive-loss block (24h) and
      # long-term persistent-loser ban (7d) ignore trades closed before this
      # timestamp. Set to the dm=-1 → +1 flip (PR #178, 2026-05-04 09:55 UTC)
      # so the post-flip SHORT cohort isn't blocked by its own pre-flip
      # losses, which were structurally inverse signals (counter-WR=93.9%).
      # Remove once the rolling 7-day window has cleared (after 2026-05-11).
      EXECUTOR_LOSS_GATE_EPOCH: "2026-05-04T09:55:00Z"
      # OPTIMIZER_EPOCH_START — DISABLED 2026-05-06.
      # Originally set to floor training/OOS windows to the dm flip boundary
      # (PR #188). Made redundant by the SQL reset of signal_weights to
      # baseline 1.0 the same day: trial Optuna runs always use dm=+1 (global
      # is hard-pinned) and signal-raw outputs are independent of dm, so the
      # epoch filter was excluding 4d of usable training data without
      # protective benefit. Empirically the filter aborted every Optuna
      # cycle for 14h+, leaving PRs #189-#191 inert. Re-enable only if a
      # future regression is traced back to pre-flip contamination.
      # Existing OPTIMIZER_DM_FLIP_MIN_LIFT=0.5 (line ~135) already protects
      # against spurious dm flips on mixed pre/post-flip training data.
      # OPTIMIZER_EPOCH_START: "2026-05-04T09:55:00Z"
      # Lower the OOS-gate min-markets floor from default 8 → 5.
      # crypto_intraday only has 7 tracked markets in the universe, so the
      # 8-market floor blocks OOS apply forever for that type even when
      # Sharpe metrics are passing. 5 is still strict enough to avoid local
      # maxima on tiny universes (the original 6-market event_financial
      # incident that motivated the floor would still be rejected).
      OPTIMIZER_MIN_MARKETS_FOR_APPLY: "5"
      # OOS-gate min-trades floors per market_type. Defaults (30/20/15/10/5)
      # were calibrated for higher trading volume. Current system produces
      # ~10 trades/24h total; cycle 4 (2026-05-06) had every type fail OOS
      # with trade counts of 12 (crypto_intraday vs 30), 13 (event_financial
      # vs 15), 5 (event_short vs 10). Lowered to keep Optuna iterating.
      # Primary OOS gate (Sharpe + minMarkets + drawdown) still in force.
      OPTIMIZER_MIN_TRADES_CRYPTO_INTRADAY: "10"
      OPTIMIZER_MIN_TRADES_EVENT_FINANCIAL: "10"
      OPTIMIZER_MIN_TRADES_EVENT_SHORT: "5"
      # Gate 0e: EventOTMGate — block opens on event_financial markets near expiry
      # with extreme-band prices. See docs/plans/2026-04-21-event-otm-gate-design.md
      EXECUTOR_EVENT_OTM_MARKET_TYPES: "event_financial"
      EXECUTOR_EVENT_OTM_TTR_HOURS: "240"
      EXECUTOR_EVENT_OTM_PRICE_LO: "0.20"
      EXECUTOR_EVENT_OTM_PRICE_HI: "0.80"
      # Gate 0f: per-(market_type, direction) blocklist. Cells with empirical
      # anti-edge in generator_predictions per-type t-stat analysis. The
      # signal_weights schema can't separately downweight SHORT vs LONG inside
      # a (signal, type), so the only place to act on direction asymmetry is
      # this executor filter. Format: comma-separated type:direction pairs
      # (both lowercase). Configured 2026-05-11 from 3 days of P2 data:
      #   mean_reversion event_financial LONG  t=+8.61  (strong edge — allow)
      #   mean_reversion event_financial SHORT t=-9.97  (strong anti — block)
      # Closes of existing positions are never blocked (unwind path).
      EXECUTOR_BLOCKED_TYPE_DIRECTIONS: "event_financial:short"
      # Market type gate: only trade these types live, shadow-trade the rest
      # event_financial: WTI, Fed, indices (continuous underlying)
      # event_short: event markets with short resolution windows (better win rate than event_long)
      ALLOWED_MARKET_TYPES: "crypto_intraday,crypto_daily,event_financial,event_short"
      # Market Classifier (Haiku)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Direction Exploration — set EPSILON=0 to disable
      DIRECTION_EXPLORATION_EPSILON: "0.10"
      DIRECTION_EXPLORATION_MIN: "0.0"
      DIRECTION_EXPLORATION_MAX: "1.0"
      DIRECTION_EXPLORATION_BREAKER_MIN_TRADES: "20"
      DIRECTION_EXPLORATION_BREAKER_WINDOW_DAYS: "7"
      DIRECTION_EXPLORATION_BREAKER_MAX_CUM_LOSS: "-150"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 60M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  timescaledb_data:
    driver: local
