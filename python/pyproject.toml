[project]
name = "polymarket-ml"
version = "0.1.0"
description = "ML optimization components for Polymarket trading system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3,<0.137",
    "starlette>=1.3.1,<1.4",
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.19",
    "uvicorn[standard]>=0.27.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "scikit-optimize>=0.10.0",
    "xgboost>=2.0.0",
    "pydantic>=2.14.1,<3",
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
