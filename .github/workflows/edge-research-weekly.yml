name: Edge Research Weekly Scoreboard

# Re-runs the edge-research harness against the live panel once a week (after the
# market_panel forward snapshot accrues), commits the refreshed scoreboard, and
# alerts only when a CLEAN pass appears (status=pass with NO caveat) — a new
# tradeable edge. The harness itself runs offline from CSVs exported on the VM
# (the dashboard container is Node/Alpine; no Python/psycopg2), via
# `run.py --datasets-dir`.

on:
  schedule:
    - cron: '0 9 * * 1'    # Mondays 09:00 UTC
  workflow_dispatch:

concurrency:
  group: edge-research-weekly
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/992492426638/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@project-94e9f6f2-aba7-4cb6-afc.iam.gserviceaccount.com'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install fixed deploy SSH key
        # Reuse a STABLE key (secret GCP_SSH_PRIVATE_KEY; public half in the VM's
        # ssh-keys metadata) so `gcloud compute ssh` does NOT regenerate an ephemeral
        # key per run — regeneration churned the shared `Usuario` ssh-keys metadata and
        # broke SSH with `Permission denied (publickey)` (2026-06-15). Writing to
        # gcloud's DEFAULT key path makes it reuse this key without re-uploading.
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/google_compute_engine
          chmod 600 ~/.ssh/google_compute_engine
          ssh-keygen -y -f ~/.ssh/google_compute_engine > ~/.ssh/google_compute_engine.pub

      - name: Cleanup stale SSH keys in project metadata
        # Mirrors daily-review: each `gcloud compute ssh` uploads a key; without
        # pruning, metadata grows unbounded and delays key propagation past the
        # ConnectTimeout, causing `Permission denied (publickey)`.
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          gcloud compute project-info describe --format=json \
            | jq -r '.commonInstanceMetadata.items[]? | select(.key == "ssh-keys") | .value' \
            | awk -F: '{ lines[$1]=$0 } END { for (k in lines) if (k != "") print lines[k] }' \
            > "$tmp"
          if [ -s "$tmp" ]; then
            gcloud compute project-info add-metadata --metadata-from-file=ssh-keys="$tmp"
          fi
          rm -f "$tmp"

      - name: Export datasets from VM as CSV
        run: |
          set -euo pipefail
          mkdir -p datasets
          PSQL="docker exec polymarket-timescaledb psql -U polymarket -d polymarket_trading -c"
          gcloud compute ssh polymarket-vm --zone=us-east1-b --command="$PSQL \"\\copy (SELECT market_id, snapshot_at, end_date, yes_price, market_type, market_score, outcome_yes FROM market_panel WHERE outcome_yes IS NOT NULL) TO STDOUT WITH CSV HEADER\"" > datasets/market_panel.csv
          gcloud compute ssh polymarket-vm --zone=us-east1-b --command="$PSQL \"\\copy (SELECT market_id, entry_yes_price, market_type, net_pnl, net_pnl_real, entry_cost_real, resolved_at FROM flb_shadow_signals WHERE net_pnl_real IS NOT NULL) TO STDOUT WITH CSV HEADER\"" > datasets/flb_shadow_signals.csv
          # Capture-gap windows: H-MM-3's walk drops trades inside a gap and
          # resets its queue state when crossing one. Empty file is fine (no gaps).
          gcloud compute ssh polymarket-vm --zone=us-east1-b --command="$PSQL \"\\copy (SELECT gap_start, gap_end FROM mm_capture_gaps ORDER BY gap_start) TO STDOUT WITH CSV HEADER\"" > datasets/mm_gaps.csv
          echo "market_panel rows: $(($(wc -l < datasets/market_panel.csv) - 1))"
          echo "flb rows: $(($(wc -l < datasets/flb_shadow_signals.csv) - 1))"
          echo "mm_gaps rows: $(($(wc -l < datasets/mm_gaps.csv) - 1))"

      - name: Export market-making datasets from VM as CSV
        # H-MM-1 (mm_trade_spreads) and H-MM-3 (mm_fine_fills) are built by
        # multi-statement psql scripts (temp tables + asof joins, plus \set/\if
        # meta-commands) — too rich for an inline `-c`. scp each script to the VM
        # and run it with a SERVER-SIDE stdin redirect (`docker exec -i … < file`),
        # so no stdin crosses the SSH hop. `-q` suppresses command tags so only the
        # COPY-to-STDOUT CSV reaches the file. Destinations are RUN-UNIQUE under
        # /tmp (sticky bit ⇒ a fresh name is always creatable) and removed after —
        # a fixed name collided on ownership when a stale file from another user
        # existed. Without these exports the weekly scoreboard dropped the H-MM-1
        # PASS row (and would never show H-MM-3) because their datasets were absent.
        run: |
          set -euo pipefail
          PSQL="docker exec -i polymarket-timescaledb psql -U polymarket -d polymarket_trading -q -v ON_ERROR_STOP=1"
          TS="/tmp/mm_trade_spreads_${GITHUB_RUN_ID}.sql"
          FF="/tmp/mm_fine_fills_${GITHUB_RUN_ID}.sql"
          SF="/tmp/mm_shadow_fills_${GITHUB_RUN_ID}.sql"
          gcloud compute scp scripts/edge-research/mm_trade_spreads.sql "polymarket-vm:${TS}" --zone=us-east1-b
          gcloud compute scp scripts/edge-research/mm_fine_fills.sql   "polymarket-vm:${FF}" --zone=us-east1-b
          gcloud compute scp scripts/edge-research/mm_shadow_fills.sql "polymarket-vm:${SF}" --zone=us-east1-b
          # Refresh planner stats: mm_book_events had reltuples=-1 (never analysed),
          # so the forward-mid lookups planned blind. ANALYZE samples ~30k rows — cheap
          # even on the 1GB e2-micro — and lets the index scans plan correctly.
          gcloud compute ssh polymarket-vm --zone=us-east1-b --command="docker exec polymarket-timescaledb psql -U polymarket -d polymarket_trading -c 'ANALYZE mm_book_events;'"
          gcloud compute ssh polymarket-vm --zone=us-east1-b --command="$PSQL < ${TS}" > datasets/mm_trade_spreads.csv
          gcloud compute ssh polymarket-vm --zone=us-east1-b --command="$PSQL < ${FF}" > datasets/mm_fine_fills.csv
          # Full default window (14 days) now covers the whole shadow life since
          # 2026-06-14 — the gate must weigh the wide-spread early days, not just the
          # last 2. This is free now that the lookups hit mm_book_events directly via
          # idx_mm_book_token_time instead of materialising a `be` temp (see SQL header).
          gcloud compute ssh polymarket-vm --zone=us-east1-b --command="$PSQL < ${SF}" > datasets/mm_shadow_fills.csv
          gcloud compute ssh polymarket-vm --zone=us-east1-b --command="rm -f ${TS} ${FF} ${SF}" || true
          echo "mm_trade_spreads rows: $(($(wc -l < datasets/mm_trade_spreads.csv) - 1))"
          echo "mm_fine_fills rows: $(($(wc -l < datasets/mm_fine_fills.csv) - 1))"
          echo "mm_shadow_fills rows: $(($(wc -l < datasets/mm_shadow_fills.csv) - 1))"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        # Install from the harness's own requirements (single source of truth) so
        # the CI env never drifts from declared deps. The earlier `pip install
        # pandas numpy` omitted PyYAML (registry.py loads registry.yaml), crashing
        # the first scheduled run with ModuleNotFoundError: No module named 'yaml'.
        run: pip install -r scripts/edge-research/requirements.txt

      - name: Run harness
        run: |
          python scripts/edge-research/run.py \
            --datasets-dir datasets \
            --out scripts/edge-research/out \
            --computed-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Detect clean passes (tradeable edge, no caveat)
        id: passes
        run: |
          # A clean pass = status==pass AND caveats column empty. H-INE-5's
          # flat-cost pass carries a caveat, so it does NOT trigger here.
          CLEAN=$(python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("scripts/edge-research/out/scoreboard.csv")))
          clean = [r for r in rows if r["status"] == "pass" and not r["caveats"].strip()]
          for r in clean:
              print(f"{r['id']} ({r['class']}) edge_net={r['edge_net_pct']} n={r['n']}")
          PY
          )
          if [ -n "$CLEAN" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            { echo 'detail<<EOF'; echo "$CLEAN"; echo 'EOF'; } >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Alert on clean pass
        if: steps.passes.outputs.found == 'true' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MSG="🟢 Edge-research: a CLEAN pass (tradeable, no caveat) appeared on the scoreboard:\n${{ steps.passes.outputs.detail }}"
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "$(python -c "import json,sys; print(json.dumps({'text': sys.argv[1]}))" "$MSG")" \
            "$SLACK_WEBHOOK_URL" || echo "Slack post failed (non-fatal)"

      - name: Commit refreshed scoreboard
        continue-on-error: true
        run: |
          git config user.name "Edge Research (weekly)"
          git config user.email "noreply@anthropic.com"
          git add scripts/edge-research/out/scoreboard.md   # .csv is gitignored by design
          if git diff --cached --quiet; then
            echo "Scoreboard unchanged."
          else
            git commit -m "chore(edge-research): weekly scoreboard refresh [skip ci]"
            git push origin HEAD:main
          fi
