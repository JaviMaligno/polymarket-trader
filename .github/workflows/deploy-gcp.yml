# Build Docker images in GitHub Actions and deploy to GCP VM
# Images are pre-built here (fast runners) and pulled on the VM (no compilation needed)
name: Deploy to GCP

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DASHBOARD_IMAGE: ghcr.io/javimaligno/polymarket-trader/dashboard-api
  DATA_COLLECTOR_IMAGE: ghcr.io/javimaligno/polymarket-trader/data-collector

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dashboard: ${{ steps.detect.outputs.dashboard }}
      data-collector: ${{ steps.detect.outputs.data-collector }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_ref="$(git rev-parse HEAD^)"
          else
            base_ref="$(git hash-object -t tree /dev/null)"
          fi

          changed_files="$(git diff --name-only "$base_ref" "${{ github.sha }}")"

          dashboard=false
          data_collector=false

          while IFS= read -r file; do
            [ -n "$file" ] || continue

            case "$file" in
              packages/dashboard/*|packages/signals/*|packages/backtest/*|packages/trader/*|package.json|pnpm-lock.yaml|tsconfig.json)
                dashboard=true
                ;;
            esac

            case "$file" in
              packages/data-collector/*|package.json|pnpm-lock.yaml|tsconfig.json)
                data_collector=true
                ;;
            esac
          done <<< "$changed_files"

          echo "dashboard=$dashboard" >> "$GITHUB_OUTPUT"
          echo "data-collector=$data_collector" >> "$GITHUB_OUTPUT"

  build-dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dashboard-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  build-data-collector:
    needs: changes
    if: needs.changes.outputs.data-collector == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push data-collector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/data-collector/Dockerfile.gcp
          push: true
          tags: |
            ${{ env.DATA_COLLECTOR_IMAGE }}:latest
            ${{ env.DATA_COLLECTOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=data-collector
          cache-to: type=gha,mode=max,scope=data-collector

  deploy:
    needs: [changes, build-dashboard, build-data-collector]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/992492426638/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@project-94e9f6f2-aba7-4cb6-afc.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Cleanup stale SSH keys in project metadata
        # Each `gcloud compute ssh` regenerates and uploads a key. Without
        # cleanup, project metadata grows unbounded (we hit 165KB / 284 keys
        # on 2026-04-15, which delayed key propagation and broke deploys with
        # `Permission denied (publickey)`). Keep the latest key per user only.
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          gcloud compute project-info describe \
            --format=json \
            | jq -r '.commonInstanceMetadata.items[]? | select(.key == "ssh-keys") | .value' \
            | awk -F: '{ lines[$1]=$0 } END { for (k in lines) if (k != "") print lines[k] }' \
            > "$tmp"
          if [ -s "$tmp" ]; then
            gcloud compute project-info add-metadata \
              --metadata-from-file=ssh-keys="$tmp"
          fi
          rm -f "$tmp"

      - name: Deploy to VM
        run: |
          gcloud compute ssh Usuario@polymarket-vm \
            --zone=us-east1-b \
            --ssh-flag="-o ServerAliveInterval=30" \
            --command="echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u github-actions --password-stdin && cd /home/Usuario/polymarket-trader && git pull --ff-only origin main && docker compose -f docker-compose.gcp.yml pull data-collector dashboard-api && docker compose -f docker-compose.gcp.yml up -d --remove-orphans"

      - name: Health check
        run: |
          echo "Waiting for services to become healthy..."
          dashboard_ok=false
          collector_ok=false
          for i in $(seq 1 24); do
            if [ "$dashboard_ok" = false ] && curl -sf http://34.148.24.147:3001/health > /dev/null 2>&1; then
              echo "Dashboard API healthy after $((i * 5))s"
              dashboard_ok=true
            fi
            if [ "$collector_ok" = false ] && curl -sf http://34.148.24.147:10000/health > /dev/null 2>&1; then
              echo "Data collector healthy after $((i * 5))s"
              collector_ok=true
            fi
            if [ "$dashboard_ok" = true ] && [ "$collector_ok" = true ]; then
              echo "All services healthy!"
              exit 0
            fi
            sleep 5
          done
          if [ "$dashboard_ok" = false ]; then
            echo "Dashboard API health check failed after 120s (may still be starting)"
          fi
          if [ "$collector_ok" = false ]; then
            echo "Data collector health check failed after 120s (may still be starting)"
          fi
