# Build Docker images in GitHub Actions and deploy to GCP VM
# Images are pre-built here (fast runners) and pulled on the VM (no compilation needed)
name: Deploy to GCP

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.gitignore'

env:
  REGISTRY: ghcr.io
  DASHBOARD_IMAGE: ghcr.io/javimaligno/polymarket-trader/dashboard-api
  DATA_COLLECTOR_IMAGE: ghcr.io/javimaligno/polymarket-trader/data-collector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push dashboard-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push data-collector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/data-collector/Dockerfile.gcp
          push: true
          tags: |
            ${{ env.DATA_COLLECTOR_IMAGE }}:latest
            ${{ env.DATA_COLLECTOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/992492426638/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@project-94e9f6f2-aba7-4cb6-afc.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to VM
        run: |
          gcloud compute ssh Usuario@polymarket-vm \
            --zone=us-east1-b \
            --ssh-flag="-o ServerAliveInterval=30" \
            --command="echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u github-actions --password-stdin && cd /home/Usuario/polymarket-trader && git pull origin main && docker compose -f docker-compose.gcp.yml pull data-collector dashboard-api && docker compose -f docker-compose.gcp.yml up -d --remove-orphans"

      - name: Health check
        run: |
          sleep 60
          curl -sf http://34.148.24.147:3001/health || echo "Dashboard API health check failed (may still be starting)"
          curl -sf http://34.148.24.147:10000/health || echo "Data collector health check failed (may still be starting)"
