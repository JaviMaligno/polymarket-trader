name: Agent-Trader (weekly LLM bets)

# LLM-as-trader benchmark: Claude IS the signal. Each run evaluates resolved paper
# bets, fetches researchable Polymarket candidates, researches per-market, and places
# a few hold-to-resolution paper bets where its research beats the price net of spread.
# Paper only (hypothetical $1000 bankroll). Track record committed to scripts/agent-trader/.

on:
  schedule:
    - cron: '7 13 * * 1'   # Mondays 13:07 UTC (off-peak minute)
    - cron: '7 13 2 * *'   # 2nd-of-month self-heal catch-up (only researches if the last
                           # Monday was a capped null run — see the guard in the run step)
  workflow_dispatch:        # Manual run any time

concurrency:
  group: agent-trader
  cancel-in-progress: false

permissions:
  contents: write           # commit bets.jsonl + lessons.md

jobs:
  agent-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install --no-save nodemailer
          pip install --quiet requests

      - name: Configure git
        run: |
          git config user.name "Claude (Agent-Trader)"
          git config user.email "noreply@anthropic.com"

      - name: Run weekly decision loop
        env:
          # Provider: Claude via Microsoft Foundry (Azure) since 2026-07-20 — the first-party
          # Anthropic key was revoked. Deployment names must match the Foundry portal.
          CLAUDE_CODE_USE_FOUNDRY: "1"
          ANTHROPIC_FOUNDRY_RESOURCE: ${{ secrets.AZURE_FOUNDRY_RESOURCE }}
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: "claude-sonnet-4-6"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "claude-haiku-4-5"
        working-directory: scripts/agent-trader
        run: |
          set -uo pipefail
          # Self-heal for the monthly-spend-cap silent-null-run (2026-06-29): the Anthropic key's
          # monthly budget can exhaust before the last Monday of a month, and `claude --print` exits
          # 0 on the spend-cap error, so that week no-ops silently. The cap resets on the 1st, so this
          # workflow also fires on the 2nd as a catch-up. On the catch-up trigger ONLY, research just
          # if the last real research run is stale (>5 days = the previous Monday was a null run);
          # otherwise skip cleanly — no duplicate bets, no metrics row, no email.
          SCHEDULE='${{ github.event.schedule }}'
          if [ "$SCHEDULE" = "7 13 2 * *" ]; then
            LAST_RUN_DATE=$(grep -oE '^## Run [0-9]+ — [0-9]{4}-[0-9]{2}-[0-9]{2}' lessons.md \
              | tail -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true)
            if [ -n "$LAST_RUN_DATE" ]; then
              AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST_RUN_DATE" +%s) ) / 86400 ))
              if [ "$AGE_DAYS" -le 5 ]; then
                echo "Catch-up: last research run ($LAST_RUN_DATE) was ${AGE_DAYS}d ago (<=5) — last Monday ran fine, skipping."
                touch /tmp/agent-skip
                exit 0
              fi
              echo "Catch-up: last research run ($LAST_RUN_DATE) was ${AGE_DAYS}d ago (>5) — last Monday likely capped, researching now."
            fi
          fi
          # Evaluate resolved bets first (deterministic), so the agent sees fresh state.
          python agent_trader.py evaluate || true
          # Fingerprint the track record BEFORE the agent runs. The null-run corroborator below
          # compares content, not working-tree state: the agent has Bash and has been seen running
          # `git commit` itself (2026-07-27), which leaves `git diff` clean on a perfectly healthy
          # run and made the detector cry wolf. Content fingerprints are immune to that.
          # awk, not `grep -c || echo 0`: grep exits 1 on zero matches *after* printing "0", so the
          # fallback would concatenate a second 0 and the later `-gt` would abort on a non-integer.
          RUNS_BEFORE=$(awk '/^## Run /{n++} END{print n+0}' lessons.md 2>/dev/null || echo 0)
          if [ -f lessons.md ]; then
            LESSONS_HAD=1
            LESSONS_SUM_BEFORE=$(md5sum lessons.md | cut -d' ' -f1)
          else
            LESSONS_HAD=0
            LESSONS_SUM_BEFORE=absent
          fi
          BETS_BEFORE=$(wc -l < bets.jsonl 2>/dev/null || echo 0)
          # Hand the decision loop to Claude with web + bash access. The prompt file
          # drives the full research->bet->lessons routine. Capture the exit status:
          # `claude --print` can exit 0 on an API error (e.g. spend-cap reached), so a
          # bare `|| true` would hide a total no-op behind a green check. Detect both the
          # non-zero exit AND the in-band error signature, and corroborate with whether the
          # agent actually appended to lessons.md — a real run always does.
          AGENT_OK=1
          cat agent-trader-prompt.md | claude \
            --model claude-sonnet-4-6 \
            --print \
            --permission-mode acceptEdits \
            --allowedTools "Bash WebSearch WebFetch Read Write Edit" \
            > /tmp/agent-run.log 2>&1 || AGENT_OK=0
          cat /tmp/agent-run.log
          if grep -qiE "API Error|usage limit|rate limit|Execute error|Overloaded|Not logged in" /tmp/agent-run.log; then
            AGENT_OK=0
          fi
          RUNS_AFTER=$(awk '/^## Run /{n++} END{print n+0}' lessons.md 2>/dev/null || echo 0)
          if [ -f lessons.md ]; then
            LESSONS_HAS=1
            LESSONS_SUM_AFTER=$(md5sum lessons.md | cut -d' ' -f1)
          else
            LESSONS_HAS=0
            LESSONS_SUM_AFTER=absent
          fi
          BETS_AFTER=$(wc -l < bets.jsonl 2>/dev/null || echo 0)
          # A real run always appends a new `## Run N — <date>` section; accept a plain content
          # change or a new bet line as corroboration too, so a formatting drift in the header
          # can't downgrade a genuine run to a false alarm. The checksum branch requires the file
          # to exist on BOTH sides — a vanished lessons.md is a broken run, not a productive one.
          if [ "$RUNS_AFTER" -gt "$RUNS_BEFORE" ] \
            || { [ "$LESSONS_HAD" = "1" ] && [ "$LESSONS_HAS" = "1" ] \
                 && [ "$LESSONS_SUM_AFTER" != "$LESSONS_SUM_BEFORE" ]; } \
            || [ "$BETS_AFTER" -gt "$BETS_BEFORE" ]; then
            LESSONS_TOUCHED=1
          else
            LESSONS_TOUCHED=0
          fi
          echo "AGENT_OK=$AGENT_OK LESSONS_TOUCHED=$LESSONS_TOUCHED (runs ${RUNS_BEFORE}->${RUNS_AFTER}, bets ${BETS_BEFORE}->${BETS_AFTER})"
          if [ "$AGENT_OK" = "0" ] || [ "$LESSONS_TOUCHED" = "0" ]; then
            AGENT_OK=0
            echo "::warning::Agent-Trader LLM run did NOT complete (API error / no lessons written). This week produced no research — see /tmp/agent-run.log above."
          fi
          echo "$AGENT_OK" > /tmp/agent-ok
          echo "=== final summary ==="
          python agent_trader.py summary || true
          # Append the per-run metrics snapshot (calibration + cost-aware P&L CI trajectory).
          python agent_trader.py metrics "$(date -u +%Y-%m-%d)" || true

      - name: Email weekly summary
        if: always()
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_ADDRESS: ${{ secrets.GMAIL_TO_ADDRESS }}
        run: |
          set -uo pipefail
          # A catch-up that skipped (healthy month) did nothing — don't email an empty report.
          if [ -f /tmp/agent-skip ]; then
            echo "Catch-up on a healthy month (last Monday ran) — nothing to email."
            exit 0
          fi
          python scripts/agent-trader/agent_trader.py email_html /tmp/at-email.html || true
          AGENT_OK=$(cat /tmp/agent-ok 2>/dev/null || echo 1)
          SUBJECT="Agent-Trader weekly — $(date -u +%Y-%m-%d)"
          if [ "$AGENT_OK" = "0" ]; then
            # Surface the silent-null-run in the subject so a no-op week can't masquerade
            # as a disciplined "0 bets" run in the inbox.
            SUBJECT="⚠️ Agent-Trader weekly — AGENT DID NOT RUN — $(date -u +%Y-%m-%d)"
          fi
          if [ -f /tmp/at-email.html ] && [ -n "${GMAIL_USERNAME:-}" ]; then
            node scripts/send-review-email.js /tmp/at-email.html "$SUBJECT" \
              && echo "Email sent" || echo "::warning::Email send failed"
          else
            echo "::warning::No email sent (missing html or GMAIL_* secrets)"
          fi

      - name: Commit track record
        run: |
          set -euo pipefail
          git add scripts/agent-trader/bets.jsonl scripts/agent-trader/lessons.md scripts/agent-trader/metrics.jsonl
          if git diff --cached --quiet; then
            echo "No staged changes of our own (no bets placed / no resolutions)."
          else
            git commit -m "chore(agent-trader): weekly run $(date -u +%Y-%m-%d) [skip ci]"
          fi
          # Push whatever HEAD is ahead of the checked-out SHA, not just our own commit. The agent
          # has Bash and has committed the track record itself (2026-07-27); if it does that AND we
          # stage nothing (e.g. the metrics snapshot failed), the old `push` inside the else branch
          # never ran and the whole week's research died with the runner.
          if [ -n "$(git log --oneline "${GITHUB_SHA}..HEAD")" ]; then
            git log --oneline "${GITHUB_SHA}..HEAD"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Nothing to push."
          fi
