name: Daily Trade Review (Claude Analysis)

on:
  schedule:
    - cron: '0 8 * * *'   # 8:00 UTC daily
  workflow_dispatch:        # Manual trigger for testing

concurrency:
  group: daily-review
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  daily-review-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_trading
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install --no-save nodemailer
          pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/992492426638/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@project-94e9f6f2-aba7-4cb6-afc.iam.gserviceaccount.com'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure git
        run: |
          git config user.name "Claude (Daily Review)"
          git config user.email "noreply@anthropic.com"

      - name: Run pre-review tests
        id: pre_tests
        run: |
          # Unit tests — catch any regressions before review starts
          echo "=== UNIT TESTS $(date -u +'%Y-%m-%d %H:%M UTC') ===" > test-results.txt
          if pnpm test 2>&1 | tee -a test-results.txt | grep -q "passed"; then
            echo "unit_status=pass" >> $GITHUB_OUTPUT
          else
            echo "unit_status=fail" >> $GITHUB_OUTPUT
          fi

          # Integration tests — position lifecycle invariants against real PostgreSQL
          echo "" >> test-results.txt
          echo "=== INTEGRATION TESTS ===" >> test-results.txt
          if DATABASE_URL="postgres://test:test@localhost:5432/test_trading" \
             pnpm run test:integration 2>&1 | tee -a test-results.txt | grep -q "passed\|skipped"; then
            echo "integration_status=pass" >> $GITHUB_OUTPUT
          else
            echo "integration_status=fail" >> $GITHUB_OUTPUT
          fi

          echo "" >> test-results.txt
          echo "Unit: ${{ steps.pre_tests.outputs.unit_status }}, Integration: ${{ steps.pre_tests.outputs.integration_status }}" >> test-results.txt
          cat test-results.txt

      - name: Gather data from VM
        id: gather
        run: |
          SSH="gcloud compute ssh Usuario@polymarket-vm --zone=us-east1-b --ssh-flag=-o --ssh-flag=ServerAliveInterval=30 --ssh-flag=-o --ssh-flag=StrictHostKeyChecking=no --ssh-flag=-o --ssh-flag=ConnectTimeout=30"

          # Run script on VM, save to temp file
          $SSH --command="cd /home/Usuario/polymarket-trader && git pull --quiet origin main >/dev/null 2>&1; bash scripts/daily-review.sh > /tmp/daily-review-output.json 2>/tmp/daily-review-stderr.log" \
            2>ssh-stderr.log || true

          # Retrieve JSON
          $SSH --command="cat /tmp/daily-review-output.json" \
            > review-data.json 2>>ssh-stderr.log || true

          if ! jq . review-data.json > /dev/null 2>&1; then
            echo "::error::Invalid JSON from daily-review.sh"
            cat ssh-stderr.log 2>/dev/null || true
            exit 1
          fi
          echo "data_collected=true" >> $GITHUB_OUTPUT

      - name: Run Claude Code Analysis
        if: steps.gather.outputs.data_collected == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_ADDRESS: ${{ secrets.GMAIL_TO_ADDRESS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          {
            cat scripts/daily-review-prompt.md
            echo ""
            echo "The data file is at: $(pwd)/review-data.json"
            echo "The repo is checked out at: $(pwd)"
            echo "You have access to gh CLI (authenticated), gcloud CLI, and node."
            echo ""
            echo "=== PRE-REVIEW TEST STATE ==="
            cat test-results.txt
            echo "==========================="
            echo ""
            echo "IMPORTANT: Create the GitHub Issue, implement fixes as PRs (deploy to VM to verify each, then rollback to main), send the email (using node scripts/send-review-email.js), and send Slack alert if needed."
            echo "When done, output a single line: REVIEW_COMPLETE"
          } | claude --model claude-sonnet-4-6 \
            --print \
            --verbose \
            --max-turns 100 \
            --dangerously-skip-permissions \
            2>&1 | tee claude-output.log

      - name: Capture Claude session ID
        id: capture_session
        if: always()
        run: |
          # Find the most recently modified .jsonl session file (written during the Claude run above)
          SESSION_FILE=$(ls -t ~/.claude/projects/*/*.jsonl 2>/dev/null | head -1 || true)
          if [ -n "$SESSION_FILE" ]; then
            SESSION_ID=$(basename "$SESSION_FILE" .jsonl)
            echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
            echo "Captured session ID: $SESSION_ID"
          else
            echo "No Claude session file found — retry will use a new session"
          fi

      - name: Verify PR branches pass tests
        id: verify_prs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract PR branches created by Claude in this session
          PR_BRANCHES=$(grep -oP 'fix/daily-review-[a-z0-9-]+' claude-output.log | sort -u || true)

          if [ -z "$PR_BRANCHES" ]; then
            echo "No PR branches found — skipping verification"
            echo "has_failures=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FAILURES=""
          for branch in $PR_BRANCHES; do
            git fetch origin "$branch" 2>/dev/null || continue
            git checkout "$branch" 2>/dev/null || continue

            echo "--- Testing branch: $branch ---"
            if ! pnpm test 2>&1 | tee branch-test-output.txt | grep -q "passed"; then
              FAILURES="${FAILURES}\nBranch ${branch}: unit tests FAILED"
              cat branch-test-output.txt | tail -15
            fi

            # Integration tests if branch touches DB/position code
            if git diff origin/main --name-only | grep -qE "(repositor|Position|Signal|CircuitBreaker|StopLoss|Cleanup)"; then
              if ! DATABASE_URL="postgres://test:test@localhost:5432/test_trading" \
                 pnpm run test:integration 2>&1 | tee branch-int-output.txt | grep -q "passed"; then
                FAILURES="${FAILURES}\nBranch ${branch}: integration tests FAILED"
                cat branch-int-output.txt | tail -15
              fi
            fi

            git checkout main
          done

          if [ -n "$FAILURES" ]; then
            printf "%b" "$FAILURES" > test-failures.txt
            echo "has_failures=true" >> $GITHUB_OUTPUT
            echo "Test failures found:"
            cat test-failures.txt
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
            echo "All PR branches pass tests"
          fi

      - name: Fix test failures (Claude retry)
        if: steps.verify_prs.outputs.has_failures == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build the retry prompt into a temp file (avoids heredoc-at-column-0 breaking YAML)
          {
            echo "The PRs you created have test failures. Fix them on each branch and push."
            echo "Do NOT create new PRs — push fixes to the existing branches."
            echo ""
            echo "=== FAILURES ==="
            cat test-failures.txt
            echo "================"
            echo ""
            echo "Run 'pnpm test' and 'pnpm run test:integration' on each branch to verify."
            echo "When done, output: FIXES_COMPLETE"
          } > /tmp/retry-prompt.txt
          PROMPT=$(cat /tmp/retry-prompt.txt)

          SESSION_ID="${{ steps.capture_session.outputs.session_id }}"

          if [ -n "$SESSION_ID" ]; then
            # Resume the previous session — Claude already knows what PRs it created and why
            echo "Resuming session $SESSION_ID with full prior context"
            claude --resume "$SESSION_ID" \
              --model claude-sonnet-4-6 \
              --print \
              --verbose \
              --max-turns 40 \
              --dangerously-skip-permissions \
              "$PROMPT" \
              2>&1 | tee claude-fix-output.log
          else
            # Fallback: new session without prior context
            echo "No session ID found — starting fresh retry session"
            echo "$PROMPT" | claude --model claude-sonnet-4-6 \
              --print \
              --verbose \
              --max-turns 40 \
              --dangerously-skip-permissions \
              2>&1 | tee claude-fix-output.log
          fi

      - name: Upload Claude logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-log
          path: |
            claude-output.log
            claude-fix-output.log
            test-results.txt
            test-failures.txt
          retention-days: 7
