name: Daily Trade Review (Claude Analysis)

on:
  # DISABLED 2026-06-24 (quant wind-down — no-edge program closed, VM stopped).
  # Manual dispatch retained; re-enable on a regime change (real trading / new strategy).
  # schedule:
    # Runs daily at 8:00 UTC. The deterministic watchdog (gather + invariants/
    # coverage/FLB-sentinel via format-review.js → email/Slack) runs every day.
    # The expensive LLM analysis (Claude → issue + PRs) is gated to Mondays only
    # (see the "Decide review mode" step). Rationale: the system is in a
    # no-edge / no-trading steady state — the LLM concluded "healthy, no action"
    # daily for weeks while its own fragility (prompt overflow, etc.) generated
    # the only findings. Revert to daily LLM on the next regime change
    # (market-making deployed / FLB executor enabled / real trading on).
    # - cron: '0 8 * * *'   # 8:00 UTC daily  (disabled)
  workflow_dispatch:        # Manual trigger — always runs the full LLM analysis

concurrency:
  group: daily-review
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  daily-review-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_trading
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Decide review mode (deterministic daily vs full LLM weekly)
        id: decide_mode
        run: |
          # run_llm=true → run Claude analysis + issue/PR creation/merge.
          # run_llm=false → deterministic watchdog only (gather + notifications).
          # LLM runs on Mondays (date -u +%u == 1) or any manual dispatch.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "1" ]; then
            echo "run_llm=true" >> $GITHUB_OUTPUT
            echo "Review mode: FULL LLM analysis (Monday or manual dispatch)"
          else
            echo "run_llm=false" >> $GITHUB_OUTPUT
            echo "Review mode: deterministic watchdog only (gather + notifications)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          npm install -g @anthropic-ai/claude-code
          npm install --no-save nodemailer
          pnpm install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/992492426638/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@project-94e9f6f2-aba7-4cb6-afc.iam.gserviceaccount.com'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install fixed deploy SSH key
        # Reuse a STABLE key (secret GCP_SSH_PRIVATE_KEY; public half in the VM's
        # ssh-keys metadata) so `gcloud compute ssh` does NOT regenerate an ephemeral
        # key per run — regeneration churned the shared `Usuario` ssh-keys metadata and
        # broke SSH with `Permission denied (publickey)` (2026-06-15). Writing to
        # gcloud's DEFAULT key path makes it reuse this key without re-uploading.
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/google_compute_engine
          chmod 600 ~/.ssh/google_compute_engine
          ssh-keygen -y -f ~/.ssh/google_compute_engine > ~/.ssh/google_compute_engine.pub

      - name: Configure git
        run: |
          git config user.name "Claude (Daily Review)"
          git config user.email "noreply@anthropic.com"

      - name: Cleanup stale SSH keys in project metadata
        # Each `gcloud compute ssh` regenerates and uploads a key. Without
        # cleanup, project metadata grows unbounded and delays key propagation
        # past the ConnectTimeout, causing `Permission denied (publickey)`.
        # deploy-gcp.yml has this step since 2026-04-15; the daily-review was
        # missing it, causing the 5-day notification outage (2026-05-05 to 09).
        # Keep the latest key per user only.
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          gcloud compute project-info describe \
            --format=json \
            | jq -r '.commonInstanceMetadata.items[]? | select(.key == "ssh-keys") | .value' \
            | awk -F: '{ lines[$1]=$0 } END { for (k in lines) if (k != "") print lines[k] }' \
            > "$tmp"
          if [ -s "$tmp" ]; then
            gcloud compute project-info add-metadata \
              --metadata-from-file=ssh-keys="$tmp"
          fi
          rm -f "$tmp"

      - name: Run pre-review tests
        id: pre_tests
        if: steps.decide_mode.outputs.run_llm == 'true'
        run: |
          # Unit tests — catch any regressions before review starts.
          # Track status in shell locals: step outputs are NOT readable inside
          # the step that defines them (${{ steps.pre_tests.outputs.* }} expands
          # before the step runs), which left the footer "Unit: , Integration:"
          # blank in the prompt.
          echo "=== UNIT TESTS $(date -u +'%Y-%m-%d %H:%M UTC') ===" > test-results.txt
          UNIT_STATUS=fail
          if pnpm test 2>&1 | tee -a test-results.txt | grep -q "passed"; then
            UNIT_STATUS=pass
          fi
          echo "unit_status=$UNIT_STATUS" >> $GITHUB_OUTPUT

          # Integration tests — position lifecycle invariants against real PostgreSQL
          echo "" >> test-results.txt
          echo "=== INTEGRATION TESTS ===" >> test-results.txt
          INT_STATUS=fail
          if DATABASE_URL="postgres://test:test@localhost:5432/test_trading" \
             pnpm run test:integration 2>&1 | tee -a test-results.txt | grep -q "passed\|skipped"; then
            INT_STATUS=pass
          fi
          echo "integration_status=$INT_STATUS" >> $GITHUB_OUTPUT

          echo "" >> test-results.txt
          echo "Unit: $UNIT_STATUS, Integration: $INT_STATUS" >> test-results.txt
          cat test-results.txt

      - name: Gather data from VM
        id: gather
        run: |
          SSH="gcloud compute ssh Usuario@polymarket-vm --zone=us-east1-b --ssh-flag=-o --ssh-flag=ServerAliveInterval=30 --ssh-flag=-o --ssh-flag=StrictHostKeyChecking=no --ssh-flag=-o --ssh-flag=ConnectTimeout=60"

          # Retry loop: VM SSH key propagation can take up to 60s after the
          # project-metadata update in the cleanup step above. Three attempts
          # with 20s waits gives ~3 minutes total before falling back.
          SSH_OK=false
          for attempt in 1 2 3; do
            if $SSH --command="echo ssh_ok" > /dev/null 2>>ssh-stderr.log; then
              SSH_OK=true
              break
            fi
            echo "::warning::SSH attempt $attempt/3 failed — waiting 20s for key propagation"
            sleep 20
          done

          if [ "$SSH_OK" = "true" ]; then
            # Run script on VM, save to temp file
            $SSH --command="cd /home/Usuario/polymarket-trader && git pull --quiet origin main >/dev/null 2>&1; bash scripts/daily-review.sh > /tmp/daily-review-output.json 2>/tmp/daily-review-stderr.log" \
              2>>ssh-stderr.log || true

            # Retrieve JSON
            $SSH --command="cat /tmp/daily-review-output.json" \
              > review-data.json 2>>ssh-stderr.log || true
          else
            echo "::warning::SSH failed after 3 attempts — VM unreachable"
            : > review-data.json
          fi

          # Empty-file / invalid-JSON fallback: write a gather_failed stub so
          # format-review.js triggers its degraded-notification path (Slack +
          # email "FAILED" alert) instead of crashing on JSON.parse(''). Empty
          # JSON before this fix silently passed `jq .` on some runners but
          # broke notifications downstream.
          if [ ! -s review-data.json ] || ! jq . review-data.json > /dev/null 2>&1; then
            echo "::warning::review-data.json empty or invalid — emitting gather_failed stub"
            cat ssh-stderr.log 2>/dev/null | head -20 || true
            printf '{"gather_failed":true,"ssh_error":true,"generated_at":"%s"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > review-data.json
          fi
          echo "data_collected=true" >> $GITHUB_OUTPUT

      - name: Run Claude Code Analysis
        if: steps.gather.outputs.data_collected == 'true' && steps.decide_mode.outputs.run_llm == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          {
            cat scripts/daily-review-prompt.md
            echo ""
            echo "The data file is at: $(pwd)/review-data.json"
            echo "The repo is checked out at: $(pwd)"
            echo "You have access to gh CLI (authenticated), gcloud CLI, and node."
            echo ""
            echo "=== PRE-REVIEW TEST STATE ==="
            # Summarize, don't dump: the raw test-results.txt is ~6.6k lines /
            # 440 KB (~110k tokens) of pino noise + per-test stdout. cat-ing it
            # whole overflowed the Sonnet context ("Prompt is too long", #308).
            # The summarizer keeps counts + failures (~10 lines); full log is a
            # CI artifact. Fail-soft to the raw tail if the script is missing.
            node scripts/summarize-test-output.js test-results.txt 2>/dev/null \
              || tail -40 test-results.txt
            echo "==========================="
            echo ""
            echo "IMPORTANT: Create the GitHub Issue and implement fixes as PRs (deploy to VM to verify each, then rollback to main). Do NOT send email or Slack — the workflow handles notifications automatically."
            echo "IMPORTANT: Prioritize root-cause infra/control failures over tactical mitigations. Prefer 0 PRs over speculative symptom patches."
            echo "IMPORTANT: If a PR is only containment (thresholds, memory knobs, cooldown tuning), label it clearly as temporary containment in the issue and PR."
            echo "When done, output a single line: REVIEW_COMPLETE"
          } | claude --model claude-sonnet-4-6 \
            --print \
            --verbose \
            --max-turns 100 \
            --dangerously-skip-permissions \
            2>&1 | tee claude-output.log

      - name: Verify daily-review issue was created
        id: verify_issue
        if: always() && steps.gather.outputs.data_collected == 'true' && steps.decide_mode.outputs.run_llm == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Claude's session occasionally exits without creating the daily issue
          # (judgment call when system seems healthy, or a gather_failed stub left
          # it with nothing to analyze). Step 3 of the prompt is mandatory but not
          # workflow-enforced. When the issue is missing this step files an
          # auto-stub carrying the gathered data + Claude's analysis tail, so the
          # daily audit trail is never broken (it was missing on 2026-05-16 and
          # 2026-05-18, both times Claude simply skipped issue creation).
          TODAY=$(date -u +%Y-%m-%d)
          # Use --search created:>=TODAY so the count is unambiguous even if the
          # daily issue title is unconventional.
          COUNT=$(gh issue list --label daily-review --state all \
            --search "created:>=$TODAY" --json number --jq 'length' || echo "0")
          echo "Daily-review issues created today ($TODAY): $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "issue_created=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "::warning::Claude completed analysis but did NOT create a daily-review issue today. Filing an auto-stub to preserve the audit trail."
          echo "issue_created=false" >> $GITHUB_OUTPUT

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Build the stub body. review-data.json is capped at 30k chars and the
          # Claude log at 120 lines to stay well under GitHub's 65536-char issue
          # body limit.
          {
            echo "## Auto-stub — daily review issue not filed"
            echo ""
            echo "The daily auto-review ran but did **not** create a daily-review issue (step 3 of the prompt was skipped, or the data gather failed). This stub preserves the audit trail — review the data below and close the issue if the system looks healthy."
            echo ""
            echo "**Workflow run:** $RUN_URL"
            echo ""
            echo "### Review data gathered"
            echo "<details><summary>review-data.json</summary>"
            echo ""
            echo '```json'
            head -c 30000 review-data.json 2>/dev/null || echo "(review-data.json missing)"
            echo ""
            echo '```'
            echo "</details>"
            echo ""
            echo "### Claude analysis output (tail)"
            echo "<details><summary>claude-output.log — last 120 lines</summary>"
            echo ""
            echo '```'
            tail -n 120 claude-output.log 2>/dev/null || echo "(claude-output.log missing)"
            echo '```'
            echo "</details>"
            echo ""
            echo "---"
            echo "_Filed automatically by the daily-review workflow safety-net._"
          } > stub-issue.md

          # The daily-review label normally exists already; create defensively.
          gh label create daily-review --description "Automated daily trade review" --color "0075ca" 2>/dev/null || true
          if gh issue create \
            --title "Daily Trade Review $TODAY — auto-stub (analysis not filed)" \
            --body-file stub-issue.md \
            --label daily-review; then
            echo "Auto-stub issue created"
          else
            echo "::warning::Failed to create the auto-stub daily-review issue"
          fi

      - name: Send notifications
        if: always() && steps.gather.outputs.data_collected == 'true'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO_ADDRESS: ${{ secrets.GMAIL_TO_ADDRESS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Restore notifier scripts from the triggering commit before exposing secrets.
          git restore --source "${GITHUB_SHA}" -- scripts/format-review.js scripts/send-review-email.js

          # Generate email.html and slack.json from review data
          node scripts/format-review.js review-data.json

          # Send email
          if [ -f email.html ]; then
            ISSUE_TITLE=$(grep -oP '(?<=--title ")[^"]+' claude-output.log 2>/dev/null | head -1 || true)
            SUBJECT="${ISSUE_TITLE:-Polymarket Daily Review — $(date -u +%Y-%m-%d)}"
            node scripts/send-review-email.js email.html "$SUBJECT" && echo "Email sent" || echo "::warning::Email send failed"
          else
            echo "::warning::No email.html generated — skipping email"
          fi

          # Send Slack alert if critical alerts detected
          if [ -f slack.json ] && [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -sf --connect-timeout 10 --max-time 30 -X POST -H "Content-Type: application/json" \
              -d @slack.json "$SLACK_WEBHOOK_URL" && echo "Slack alert sent" || echo "::warning::Slack send failed"
          fi

      - name: Verify VM working tree is clean
        id: verify_vm_clean
        if: always() && steps.gather.outputs.data_collected == 'true'
        run: |
          # Detect and revert any in-place edits the review made to tracked files
          # in the VM repo. Only tracked modifications break the next CI
          # `git pull --ff-only`; untracked files (e.g. review-history.json,
          # pre-existing docker-compose.override.yml) are ignored.
          SSH="gcloud compute ssh Usuario@polymarket-vm --zone=us-east1-b --ssh-flag=-o --ssh-flag=StrictHostKeyChecking=no --ssh-flag=-o --ssh-flag=ConnectTimeout=30"

          # `git status --porcelain` lines beginning with '??' are untracked.
          # Filter them out — we only care about modified/added/deleted tracked files.
          DIRTY=$($SSH --command="cd /home/Usuario/polymarket-trader && git status --porcelain" 2>/dev/null | grep -v '^??' || true)

          if [ -z "$DIRTY" ]; then
            echo "VM working tree is clean (no tracked modifications) ✅"
            echo "vm_clean=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "::error::VM working tree has tracked modifications — daily-review edited repo files directly on the VM."
          echo "Modified tracked files on VM:"
          echo "$DIRTY"
          echo ""

          # Revert tracked modifications so the next CI deploy's `git pull --ff-only` works.
          $SSH --command="cd /home/Usuario/polymarket-trader && git checkout -- . && git status --porcelain | grep -v '^??' || true" 2>&1 | tee vm-revert.log

          echo "vm_clean=false" >> $GITHUB_OUTPUT
          # Fail the workflow so the violation is visible. The revert already happened.
          exit 1

      - name: Capture Claude session ID
        id: capture_session
        if: always()
        run: |
          # Find the most recently modified .jsonl session file (written during the Claude run above)
          SESSION_FILE=$(ls -t ~/.claude/projects/*/*.jsonl 2>/dev/null | head -1 || true)
          if [ -n "$SESSION_FILE" ]; then
            SESSION_ID=$(basename "$SESSION_FILE" .jsonl)
            echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
            echo "Captured session ID: $SESSION_ID"
          else
            echo "No Claude session file found — retry will use a new session"
          fi

      - name: Verify PR branches pass tests
        id: verify_prs
        if: always() && steps.decide_mode.outputs.run_llm == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract PR branches created by Claude in this session
          PR_BRANCHES=$(grep -oP 'fix/daily-review-[a-z0-9-]+' claude-output.log | sort -u || true)

          if [ -z "$PR_BRANCHES" ]; then
            echo "No PR branches found — skipping verification"
            echo "has_failures=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FAILURES=""
          for branch in $PR_BRANCHES; do
            git fetch origin "$branch" 2>/dev/null || continue
            git checkout "$branch" 2>/dev/null || continue

            echo "--- Testing branch: $branch ---"
            if ! pnpm test 2>&1 | tee branch-test-output.txt | grep -q "passed"; then
              FAILURES="${FAILURES}\nBranch ${branch}: unit tests FAILED"
              cat branch-test-output.txt | tail -15
            fi

            # Integration tests if branch touches DB/position code
            if git diff origin/main --name-only | grep -qE "(repositor|Position|Signal|CircuitBreaker|StopLoss|Cleanup)"; then
              if ! DATABASE_URL="postgres://test:test@localhost:5432/test_trading" \
                 pnpm run test:integration 2>&1 | tee branch-int-output.txt | grep -q "passed"; then
                FAILURES="${FAILURES}\nBranch ${branch}: integration tests FAILED"
                cat branch-int-output.txt | tail -15
              fi
            fi

            git checkout main
          done

          if [ -n "$FAILURES" ]; then
            printf "%b" "$FAILURES" > test-failures.txt
            echo "has_failures=true" >> $GITHUB_OUTPUT
            echo "Test failures found:"
            cat test-failures.txt
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
            echo "All PR branches pass tests"
          fi

      - name: Fix test failures (Claude retry)
        if: steps.verify_prs.outputs.has_failures == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build the retry prompt into a temp file (avoids heredoc-at-column-0 breaking YAML)
          {
            echo "The PRs you created have test failures. Fix them on each branch and push."
            echo "Do NOT create new PRs — push fixes to the existing branches."
            echo ""
            echo "=== FAILURES ==="
            cat test-failures.txt
            echo "================"
            echo ""
            echo "Run 'pnpm test' and 'pnpm run test:integration' on each branch to verify."
            echo "When done, output: FIXES_COMPLETE"
          } > /tmp/retry-prompt.txt
          PROMPT=$(cat /tmp/retry-prompt.txt)

          SESSION_ID="${{ steps.capture_session.outputs.session_id }}"

          if [ -n "$SESSION_ID" ]; then
            # Resume the previous session — Claude already knows what PRs it created and why
            echo "Resuming session $SESSION_ID with full prior context"
            claude --resume "$SESSION_ID" \
              --model claude-sonnet-4-6 \
              --print \
              --verbose \
              --max-turns 40 \
              --dangerously-skip-permissions \
              "$PROMPT" \
              2>&1 | tee claude-fix-output.log
          else
            # Fallback: new session without prior context
            echo "No session ID found — starting fresh retry session"
            echo "$PROMPT" | claude --model claude-sonnet-4-6 \
              --print \
              --verbose \
              --max-turns 40 \
              --dangerously-skip-permissions \
              2>&1 | tee claude-fix-output.log
          fi

      - name: Auto-merge small daily-review PRs
        if: always() && steps.gather.outputs.data_collected == 'true' && steps.decide_mode.outputs.run_llm == 'true'
        env:
          # Use a PAT instead of github.token so the merge push triggers
          # downstream workflows (deploy). GitHub's security policy blocks
          # GITHUB_TOKEN-originated pushes from firing on:push workflows.
          GH_TOKEN: ${{ secrets.MERGE_PAT }}
        run: |
          [ ! -f claude-output.log ] && echo "No Claude output — skipping" && exit 0
          PR_BRANCHES=$(grep -oP 'fix/daily-review-[a-z0-9-]+' claude-output.log | sort -u || true)
          [ -z "$PR_BRANCHES" ] && echo "No PR branches — nothing to auto-merge" && exit 0

          AUTOMERGE_MAX_FILES=2
          AUTOMERGE_MAX_LINES=20

          for branch in $PR_BRANCHES; do
            PR_NUM=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            [ -z "$PR_NUM" ] && echo "[$branch] No open PR — skipping" && continue

            # Claude occasionally omits the label even though the branch belongs to this workflow.
            # Normalize metadata here so valid small fixes are not blocked on PR labeling.
            gh pr edit "$PR_NUM" --add-label "daily-review" >/dev/null 2>&1 || true

            PR_DATA=$(gh pr view "$PR_NUM" --json files,additions,deletions,changedFiles,labels)
            FILE_COUNT=$(echo "$PR_DATA" | jq '.changedFiles')
            TOTAL=$(( $(echo "$PR_DATA" | jq '.additions') + $(echo "$PR_DATA" | jq '.deletions') ))
            HAS_LABEL=$(echo "$PR_DATA" | jq '[.labels[].name] | index("daily-review") != null')
            TOUCHES_PROTECTED=$(echo "$PR_DATA" | jq '[.files[].path] | any(startswith(".github/") or startswith("scripts/daily-review"))')

            echo "PR #$PR_NUM ($branch): $FILE_COUNT files, $TOTAL lines, label=$HAS_LABEL, protected=$TOUCHES_PROTECTED"

            if [ "$HAS_LABEL" != "true" ]; then
              echo "  → Missing daily-review label — manual review required"
              continue
            fi

            if [ "$TOUCHES_PROTECTED" = "true" ]; then
              echo "  → Touches protected paths — manual review required"
              continue
            fi

            if [ "$FILE_COUNT" -gt "$AUTOMERGE_MAX_FILES" ] || [ "$TOTAL" -gt "$AUTOMERGE_MAX_LINES" ]; then
              echo "  → Exceeds size limits (max $AUTOMERGE_MAX_FILES files, $AUTOMERGE_MAX_LINES lines) — manual review"
              continue
            fi

            # Final test gate before merge (unit + integration if touching DB/position code)
            git fetch origin "$branch" 2>/dev/null || continue
            git checkout "$branch" 2>/dev/null || continue
            UNIT_OK=false
            INT_OK=true

            if pnpm test 2>&1 | tail -5 | grep -q "passed"; then
              UNIT_OK=true
            fi

            if git diff origin/main --name-only | grep -qE "(repositor|Position|Signal|CircuitBreaker|StopLoss|Cleanup)"; then
              if ! DATABASE_URL="postgres://test:test@localhost:5432/test_trading" \
                 pnpm run test:integration 2>&1 | tail -5 | grep -q "passed"; then
                INT_OK=false
              fi
            fi

            if [ "$UNIT_OK" = "true" ] && [ "$INT_OK" = "true" ]; then
              git checkout main 2>/dev/null
              echo "  → All criteria met — auto-merging"
              gh pr merge "$PR_NUM" --merge --delete-branch
            else
              git checkout main 2>/dev/null
              echo "  → Tests failed — manual review required"
            fi
          done

      - name: Trigger deploy if Claude merged PRs (safety net)
        # Claude is instructed not to merge PRs (see daily-review-prompt.md), but it has
        # github.token in its session and can still call `gh pr merge`. When it does,
        # the resulting push to main does NOT trigger Deploy to GCP because GitHub
        # blocks workflows triggered by GITHUB_TOKEN-originated pushes. This step
        # detects that case and dispatches Deploy manually with MERGE_PAT.
        #
        # Token scopes:
        # - Read-only checks (pr list, run list) use github.token, which always has
        #   the right scopes for the current repo. Earlier MERGE_PAT-only runs hit
        #   401 Unauthorized on these endpoints because the PAT lacked actions:read.
        # - The dispatch (workflow run) uses MERGE_PAT, since GitHub blocks workflow
        #   dispatches from GITHUB_TOKEN-originated requests for security.
        # The step is best-effort: any failure logs a warning but does not fail the
        # workflow. The auto-merge step above already uses MERGE_PAT to push, which
        # normally triggers Deploy on its own; this step is a backstop.
        if: always() && steps.decide_mode.outputs.run_llm == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PAT: ${{ secrets.MERGE_PAT }}
        run: |
          set -uo pipefail
          warn() { echo "::warning::safety-net: $1"; }

          SINCE=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          if ! LAST_MERGE=$(gh pr list --state merged --label daily-review \
                --search "merged:>$SINCE" \
                --json mergedAt --jq 'sort_by(.mergedAt) | last | .mergedAt // ""'); then
            warn "gh pr list failed — skipping deploy verification"
            exit 0
          fi
          if [ -z "$LAST_MERGE" ]; then
            echo "No daily-review PRs merged in last 2h — nothing to verify"
            exit 0
          fi

          if ! LAST_DEPLOY=$(gh run list --workflow="Deploy to GCP" --branch main --limit 1 \
                --json createdAt --jq '.[0].createdAt // ""'); then
            warn "gh run list failed — skipping deploy verification (merge happened, manual check recommended)"
            exit 0
          fi
          echo "Last daily-review merge: $LAST_MERGE"
          echo "Last Deploy run:        $LAST_DEPLOY"

          if [ -z "$LAST_DEPLOY" ] || [[ "$LAST_DEPLOY" < "$LAST_MERGE" ]]; then
            echo "::warning::Daily-review PR merged but no Deploy fired — dispatching manually"
            if ! GH_TOKEN="$MERGE_PAT" gh workflow run "Deploy to GCP" --ref main; then
              warn "workflow dispatch failed — Deploy must be triggered manually"
            fi
          else
            echo "Deploy already fired after the merge — no action needed"
          fi

      - name: Upload Claude logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-log
          path: |
            claude-output.log
            claude-fix-output.log
            test-results.txt
            test-failures.txt
          retention-days: 7
